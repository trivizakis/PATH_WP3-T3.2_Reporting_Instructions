[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "path-fairness"
version = "1.0.0"
description = "PATH WP3 - Task 3.2: AI Fairness & Bias Reporting Toolkit for Biomedical Machine Learning"
readme = "README.md"
authors = [
    { name = "Eleftherios Trivizakis", email = "eleftherios.trivizakis@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "jupyter>=1.0.0",
]
advanced = [
    "lifelines>=0.27.0",
    "aif360>=0.5.0",
]

